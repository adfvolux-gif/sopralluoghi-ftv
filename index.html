
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sopralluoghi FTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f4f5f7;color:#222}
main{max-width:720px;margin:auto;padding:16px}
fieldset{background:#fff;border:1px solid #ddd;border-radius:10px;margin:0 0 16px;padding:12px 16px}
legend{font-weight:600;padding:0 6px}
label{display:block;margin:10px 0 4px;font-size:14px;color:#555}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:#fff}
textarea{min-height:90px}
button{background:#1a7f37;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:16px}
.foto{display:flex;gap:10px;align-items:center;margin:10px 0}
.foto img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.foto button{background:#c33;padding:8px 12px}
.azioni{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
#btnInvia{background:#0969da}
#btnNuovo{background:#666}
</style>
</head>
<body>
<main>
<h1>Sopralluogo FTV</h1>
<form id="form" onsubmit="return false"></form>
<fieldset>
  <legend>Foto</legend>
  <input type="file" id="fileFoto" accept="image/*" multiple>
  <div id="listaFoto"></div>
</fieldset>
<div class="azioni">
  <button id="btnGenera">Genera PDF</button>
  <button id="btnInvia" hidden>Invia PDF</button>
  <button id="btnNuovo">Nuovo sopralluogo</button>
</div>
</main>

<script>
// CAMPI DEL MODULO: modifica qui per aggiungere o togliere voci
const SEZIONI=[
 {titolo:"Cliente",campi:[
  {id:"nome",l:"Nome e cognome"},
  {id:"tel",l:"Telefono",t:"tel"},
  {id:"email",l:"Email",t:"email"},
  {id:"indirizzo",l:"Indirizzo impianto"},
  {id:"data",l:"Data sopralluogo",t:"date"},
  {id:"tecnico",l:"Tecnico"}]},
 {titolo:"Fornitura elettrica",campi:[
  {id:"fase",l:"Tipo fornitura",o:["Monofase","Trifase"]},
  {id:"potenza",l:"Potenza contatore (kW)",t:"num"},
  {id:"consumo",l:"Consumo annuo (kWh)",t:"num"},
  {id:"pod",l:"POD"}]},
 {titolo:"Copertura",campi:[
  {id:"tipo",l:"Tipo copertura",o:["Tetto a falde","Tetto piano","Pensilina","A terra"]},
  {id:"materiale",l:"Materiale",o:["Coppi","Tegole","Lamiera","Guaina","Altro"]},
  {id:"orient",l:"Orientamento",o:["Sud","Sud-Est","Sud-Ovest","Est","Ovest","Est-Ovest","Nord"]},
  {id:"incl",l:"Inclinazione (°)",t:"num"},
  {id:"sup",l:"Superficie disponibile (m²)",t:"num"},
  {id:"piani",l:"Piani / altezza edificio"},
  {id:"ombre",l:"Ombreggiamenti",o:["Nessuno","Parziali","Significativi"]},
  {id:"amianto",l:"Presenza amianto",o:["No","Sì","Da verificare"]}]},
 {titolo:"Richieste cliente",campi:[
  {id:"kwp",l:"Potenza desiderata (kWp)",t:"num"},
  {id:"accumulo",l:"Accumulo",o:["Sì","No","Da valutare"]},
  {id:"wallbox",l:"Wallbox",o:["Sì","No","Da valutare"]},
  {id:"distanza",l:"Distanza quadro-inverter (m)",t:"num"}]},
 {titolo:"Note",campi:[{id:"note",l:"Note",t:"area"}]}
];

const $=id=>document.getElementById(id);
const foto=[];
let pdfFile=null;

// Costruisce il modulo
SEZIONI.forEach(s=>{
  const fs=document.createElement("fieldset");
  fs.innerHTML=`<legend>${s.titolo}</legend>`;
  s.campi.forEach(c=>{
    let campo;
    if(c.o) campo=`<select id="${c.id}"><option value="">Seleziona</option>${c.o.map(x=>`<option>${x}</option>`).join("")}</select>`;
    else if(c.t==="area") campo=`<textarea id="${c.id}"></textarea>`;
    else if(c.t==="num") campo=`<input id="${c.id}" inputmode="decimal">`;
    else campo=`<input id="${c.id}" type="${c.t||"text"}">`;
    fs.insertAdjacentHTML("beforeend",`<label for="${c.id}">${c.l}</label>${campo}`);
  });
  $("form").appendChild(fs);
});
const oggi=new Date();
$("data").value=`${oggi.getFullYear()}-${String(oggi.getMonth()+1).padStart(2,"0")}-${String(oggi.getDate()).padStart(2,"0")}`;

// Se modifichi qualcosa, il PDF va rigenerato
document.addEventListener("input",()=>$("btnInvia").hidden=true);

// Foto (ridotte per tenere leggero il PDF)
$("fileFoto").addEventListener("change",async e=>{
  for(const f of e.target.files) foto.push(await riduci(f));
  e.target.value="";
  mostraFoto();
});

function riduci(file){
  return new Promise((ok,ko)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,1400/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src);
      ok({src:c.toDataURL("image/jpeg",0.7),w:c.width,h:c.height,did:""});
    };
    img.onerror=ko;
    img.src=URL.createObjectURL(file);
  });
}

function mostraFoto(){
  $("btnInvia").hidden=true;
  const box=$("listaFoto");box.innerHTML="";
  foto.forEach((p,i)=>{
    const d=document.createElement("div");d.className="foto";
    d.innerHTML=`<img src="${p.src}"><input placeholder="Didascalia (es. quadro elettrico)"><button type="button">✕</button>`;
    const inp=d.querySelector("input");
    inp.value=p.did;
    inp.oninput=()=>p.did=inp.value;
    d.querySelector("button").onclick=()=>{foto.splice(i,1);mostraFoto();};
    box.appendChild(d);
  });
}

function val(id){
  let v=$(id).value.trim();
  if(id==="data"&&v){const [a,m,g]=v.split("-");v=`${g}/${m}/${a}`;}
  return v;
}

// Crea il PDF
function creaPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const M=15,W=180,FONDO=282;
  let y=20;
  const spazio=h=>{if(y+h>FONDO){doc.addPage();y=20;}};

  doc.setFont("helvetica","bold");doc.setFontSize(18);
  doc.text("Scheda sopralluogo fotovoltaico",M,y);y+=12;

  SEZIONI.forEach(s=>{
    spazio(16);
    doc.setFillColor(230,240,232);doc.rect(M,y-5,W,7,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text(s.titolo,M+2,y);y+=8;
    doc.setFontSize(10);
    s.campi.forEach(c=>{
      const righe=doc.splitTextToSize(val(c.id)||"-",W-62);
      spazio(righe.length*5);
      doc.setFont("helvetica","bold");doc.text(c.l,M+2,y);
      doc.setFont("helvetica","normal");doc.text(righe,M+62,y);
      y+=righe.length*5+1;
    });
    y+=5;
  });

  if(foto.length){
    doc.addPage();y=20;
    doc.setFont("helvetica","bold");doc.setFontSize(14);
    doc.text("Foto",M,y);y+=8;
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    foto.forEach((p,i)=>{
      let w=W,h=W*p.h/p.w;
      if(h>108){h=108;w=h*p.w/p.h;}
      spazio(h+12);
      doc.addImage(p.src,"JPEG",M+(W-w)/2,y,w,h);
      y+=h+5;
      doc.text(`${i+1}. ${p.did}`,M,y);y+=8;
    });
  }

  const cliente=val("nome")||"cliente";
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.text(`Sopralluogo ${cliente} - ${val("data")} - pag. ${i}/${n}`,M,290);
  }
  const nomeFile=`Sopralluogo_${cliente.replace(/[^\p{L}\p{N}]+/gu,"_")}_${val("data").replace(/\//g,"-")}.pdf`;
  return new File([doc.output("blob")],nomeFile,{type:"application/pdf"});
}

$("btnGenera").onclick=()=>{
  try{pdfFile=creaPDF();$("btnInvia").hidden=false;}
  catch(e){alert("Errore nella creazione del PDF: "+e.message);}
};

// Invia con Mail, WhatsApp, File...
$("btnInvia").onclick=async()=>{
  if(navigator.canShare&&navigator.canShare({files:[pdfFile]})){
    try{await navigator.share({files:[pdfFile]});}catch(e){}
  }else{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(pdfFile);a.download=pdfFile.name;a.click();
  }
};

$("btnNuovo").onclick=()=>{if(confirm("Cancellare tutti i dati inseriti?"))location.reload();};
</script>
</body>
</html>
